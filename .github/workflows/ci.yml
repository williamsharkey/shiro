name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: tests
      # server.mjs imports ws/undici, which live on the host (/opt/shiro/package.json)
      - run: npm install --no-save ws undici
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
